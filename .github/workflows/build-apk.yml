name: Build Tmap Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Cài đặt chuẩn Android SDK cho Gradle
        uses: android-actions/setup-android@v3

      - name: 5. Tạo cấu hình Capacitor và đóng gói APK
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            echo "<!DOCTYPE html><html><body><h1>Tmap Australia</h1></body></html>" > www/index.html
          fi
          rm -rf package.json package-lock.json node_modules android capacitor.config.*
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          echo '{"appId":"au.com.tmap.app","appName":"Tmap","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Tmap-Australia.apk

      - name: 6. Xuất file Tmap-Australia.apk
        uses: actions/upload-artifact@v4
        with:
          name: Tmap-Android-APK
          path: Tmap-Australia.apk
