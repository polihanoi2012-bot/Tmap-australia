name: Build Tmap Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn Tmap
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Cài đặt Java JDK 21 (Chuẩn mới nhất cho Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Chuẩn bị thư mục giao diện www
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            echo "<h1>Tmap App</h1>" > www/index.html
          fi

      - name: 5. Khởi tạo dự án Android (Capacitor 6 ổn định)
        run: |
          rm -rf package.json package-lock.json node_modules android capacitor.config.*
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tmap" "au.com.tmap.routeplanner" --web-dir www
          npx cap add android

      - name: 6. Tạo Logo Tmap làm Icon ứng dụng Android
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#g)"/><path d="M256 76c-82 0-148 66-148 148 0 105 130 202 136 206a20 20 0 0 0 24 0c6-4 136-101 136-206 0-82-66-148-148-148z" fill="#ffffff"/><path d="M186 156h140v38h-48v104h-44V194h-48v-38z" fill="#1d4ed8"/><circle cx="356" cy="140" r="24" fill="#10b981"/></svg>' > tmap-logo.svg
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              rsvg-convert -w 192 -h 192 tmap-logo.svg -o "$dir/ic_launcher.png" || true
              rsvg-convert -w 192 -h 192 tmap-logo.svg -o "$dir/ic_launcher_round.png" || true
              rsvg-convert -w 192 -h 192 tmap-logo.svg -o "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: 7. Cấp quyền GPS & Internet cho Android
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/><application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: 8. Đóng gói ra file Tmap-Australia.apk
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Tmap-Australia.apk

      - name: 9. Tải file APK lên để bạn tải về máy
        uses: actions/upload-artifact@v4
        with:
          name: Tmap-Android-APK
          path: Tmap-Australia.apk
