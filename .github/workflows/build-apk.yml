name: Build Tmap Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java JDK 17 (Chuẩn khớp 100% với Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Chuẩn bị thư mục web www
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            echo "<!DOCTYPE html><html><body><h1>Tmap Australia</h1></body></html>" > www/index.html
          fi

      - name: 5. Tạo cấu hình Capacitor và đóng gói APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          rm -rf package.json package-lock.json node_modules android capacitor.config.json
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "au.com.tmap.app",
            "appName": "Tmap",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Tmap-Australia.apk

      - name: 6. Xuất file Tmap-Australia.apk
        uses: actions/upload-artifact@v4
        with:
          name: Tmap-Android-APK
          path: Tmap-Australia.apk
