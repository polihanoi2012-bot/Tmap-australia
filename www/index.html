<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tmap Pro - Spoke Edition (Multi-language)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f8fafc; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .stop-pin {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white; border-radius: 9999px;
      width: 30px; height: 30px; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 13px;
      border: 2.5px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .depot-pin { background: linear-gradient(135deg, #f97316, #dc2626); }
    .asap-pin { background: linear-gradient(135deg, #e11d48, #f43f5e); }
    .active-pin { background: #10b981; transform: scale(1.35); border: 3px solid #fef08a; box-shadow: 0 0 20px rgba(16,185,129,0.9); }
    .done-pin { background: #16a34a; opacity: 0.5; }
    .failed-pin { background: #475569; opacity: 0.6; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

  <!-- HEADER -->
  <div id="appHeader" class="bg-slate-900 px-3 py-2.5 border-b border-slate-800 flex items-center justify-between shrink-0 z-30 shadow-md">
    <div class="flex items-center gap-2 cursor-pointer" onclick="openRoutesDrawer()">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center font-extrabold text-white text-base shadow">T</div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-sm font-extrabold text-white truncate max-w-[130px]" id="currentRouteTitle">Macquarie</span>
          <span class="text-[9px] bg-blue-500/20 text-blue-300 px-1.5 py-0.5 rounded font-bold" data-i18n="routesLabel">Vùng ▼</span>
        </div>
        <p class="text-[10px] text-emerald-400 font-semibold" id="summaryText">0 điểm • 0.0 km</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <!-- Nút chuyển đổi ngôn ngữ EN / VI -->
      <button onclick="toggleLanguage()" class="bg-slate-800 border border-slate-700 text-amber-400 px-2 py-1.5 rounded-lg text-xs font-extrabold" id="langToggleBtn">
        🇻🇳 VIE
      </button>
      <button onclick="openRoutesDrawer()" class="bg-blue-600/20 border border-blue-500/40 text-blue-300 px-2.5 py-1.5 rounded-lg text-xs font-bold" data-i18n="routesBtn">📂 Tuyến</button>
      <button onclick="useMyGPS()" class="bg-slate-800 border border-slate-700 text-cyan-400 px-2 py-1.5 rounded-lg text-xs font-bold">📍 GPS</button>
    </div>
  </div>

  <!-- Ô TÌM KIẾM ĐỊA CHỈ & AUTOCOMPLETE -->
  <div id="searchBarContainer" class="bg-slate-900 px-3 py-2 border-b border-slate-800 shrink-0 z-30 relative shadow-lg">
    <div class="flex gap-1.5">
      <div class="relative flex-1">
        <input id="addressInput" type="text" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="🔍 Nhập địa chỉ giao hàng tại Úc..."
          class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-3 pr-8 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
          oninput="handleAutocomplete(this.value)" onkeydown="if(event.key==='Enter') searchAddress()" />
        <button onclick="document.getElementById('addressInput').value=''; hideSuggestions();" class="absolute right-2.5 top-2.5 text-slate-500 text-sm">✕</button>
      </div>
      <button onclick="searchAddress()" id="addBtn" class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold shrink-0 shadow" data-i18n="addBtn">+ Thêm</button>
      <button onclick="openBulkModal()" class="bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-2.5 rounded-xl text-xs font-bold shrink-0" data-i18n="pasteBtn" title="Dán danh sách">📋 Dán</button>
    </div>
    <div id="suggestionsBox" class="hidden absolute left-3 right-3 top-13 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-52 overflow-y-auto z-50 divide-y divide-slate-800"></div>
  </div>

  <!-- BẢN ĐỒ -->
  <div class="relative flex-1 w-full">
    <div id="map"></div>
    <div id="activeProgressBanner" class="hidden absolute top-2 left-2 right-2 z-[400] bg-slate-900/95 border border-emerald-500/50 rounded-xl p-2.5 shadow-2xl flex items-center justify-between">
      <div class="truncate pr
